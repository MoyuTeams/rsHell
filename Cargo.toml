[workspace]
members = [
    "crates/rshell-core",
    "crates/rshell-platform",
    "crates/rshell-session",
    "crates/rshell-storage",
    "crates/rshell-ui",
]
exclude = ["third_party/portable-pty-psmux"]
resolver = "3"

[patch.crates-io]
crypto-bigint = { git = "https://github.com/MoyuTeams/crypto-bigint", rev = "9a4f70ace040b57f5f5cffc0d4389d2676baee9d", version = "=0.7.5" }

[package]
name = "rshell"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
relm4 = "0.10.1"
rshell-core = { path = "crates/rshell-core" }
rshell-platform = { path = "crates/rshell-platform" }
rshell-session = { path = "crates/rshell-session" }
rshell-storage = { path = "crates/rshell-storage" }
rshell-ui = { path = "crates/rshell-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "time"] }

[[test]]
name = "actor_panic_gtk_survival_macos"
path = "tests/actor_panic_gtk_survival_macos.rs"
harness = false
